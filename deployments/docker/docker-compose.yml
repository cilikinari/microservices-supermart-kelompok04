version: '3.8'

services:
  identity-db:
    image: mysql:8.0
    container_name: supermart-identity-db
    restart: always
    environment:
      MYSQL_DATABASE: identity_service_db
      MYSQL_USER: identity_admin
      MYSQL_PASSWORD: identity_secret_pass
      MYSQL_ROOT_PASSWORD: root_identity_pass
    ports:
      - "3306:3306"
    volumes:
      - identity_db_data:/var/lib/mysql
      - ./init-scripts/identity:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "identity_admin", "-pidentity_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supermart-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nusantara-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: identity-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: identity_service_db
      MYSQL_USER: identity_admin
      MYSQL_PASSWORD: identity_secret_pass
      APP_PORT: 3000
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000"
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - supermart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nusantara-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - supermart-network

networks:
  supermart-network:
    driver: bridge
    name: supermart-isolated-net

volumes:
  identity_db_data:
  catalog_db_data:
  inventory_db_data:
  order_db_data: