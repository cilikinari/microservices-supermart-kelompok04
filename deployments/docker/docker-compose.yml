services:
  inventory-db:
    image: mysql:8.0
    container_name: supermart-inventory-db
    restart: always
    environment:
      MYSQL_DATABASE: inventory_service_db
      MYSQL_USER: inventory_admin
      MYSQL_PASSWORD: inventory_secret_pass
      MYSQL_ROOT_PASSWORD: root_inventory_pass
    ports:
      - "3308:3306"
    volumes:
      - inventory_db_data:/var/lib/mysql
      - ./init-scripts/inventory:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "inventory_admin", "-pinventory_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supermart-network
